<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollak Immigration Operations Hub</title>
  <meta name="description" content="One connected workspace for cases, forms, documents, notices, and immigration deadlines — Pollak PLLC.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23F99A4B'/><circle cx='50' cy='50' r='26' fill='%232E75B6'/></svg>">
</head>
<body>
  <div class="app">

    <!-- ================= Sidebar ================= -->
    <nav class="sidebar" aria-label="Primary navigation">
      <div class="logo-block">
        <a href="#/dashboard" class="logo" aria-label="Pollak PLLC — Immigration Operations Hub home">
          <span class="wordmark">
            <span class="pollak">p<span class="globe" aria-hidden="true"></span>llak</span>
            <span class="pllc">pllc</span>
          </span>
          <span class="tagline">when immigration matters</span>
          <span class="product">Immigration Operations Hub</span>
        </a>
      </div>

      <ul class="nav-list" id="nav-list">
        <!-- populated by app.js -->
      </ul>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span class="avatar" id="user-avatar">SP</span>
          <span>
            <span class="u-name" id="user-name">Sarah Pollak</span><br>
            <span class="u-role" id="user-role">Attorney · Managing Attorney</span>
          </span>
        </div>
        <label class="visually-hidden" for="role-switch">Switch role (prototype demo)</label>
        <select id="role-switch" class="role-select" title="Switch role — prototype demonstration of role-based experiences">
          <option value="u1">View as: Sarah Pollak (Attorney)</option>
          <option value="u3">View as: Jessica Tran (Paralegal)</option>
          <option value="u5">View as: Alicia Fuentes (Legal Assistant)</option>
          <option value="u6">View as: Robert Chen (Firm Administrator)</option>
          <option value="portal">View as: Client (Portal)</option>
        </select>
        <div class="sidebar-links">
          <button type="button" id="btn-notifications" title="Notifications">
            <span class="noti-dot" aria-hidden="true"></span> Alerts
          </button>
          <button type="button" id="btn-help" title="Help">Help</button>
          <button type="button" id="btn-logout" title="Log out">Log out</button>
        </div>
      </div>
    </nav>

    <!-- ================= Main ================= -->
    <div class="main">
      <header class="topbar">
        <div class="global-search">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="global-search" role="combobox" aria-expanded="false" aria-label="Global search"
                 placeholder="Search clients, cases, receipt numbers, forms, documents, or deadlines  ( / )">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="topbar-right">
          <span class="env-note" title="All data in this prototype is fictional.">
            <span class="pill pill-navy">🔒 Encrypted session · MFA on</span>
          </span>
          <span class="env-note">Wed, Jul 15, 2026</span>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1" aria-live="polite">
        <!-- rendered by app.js -->
      </main>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
